section {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  font-size: 19px;
  background: #f8fafc;
  color: #1e293b;
  padding: 35px 50px 30px;
  line-height: 1.35;
  overflow: hidden;
}
section::after { font-size: 10px; color: #94a3b8; }

/* ─── COVER ─── */
section.cover {
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #0078d4 100%);
  color: white; padding: 50px;
}
section.cover h1 {
  font-size: 2.4em; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 0.15em;
  background: linear-gradient(90deg, #60a5fa, #a78bfa, #34d399);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  border: none;
}
section.cover h2 { font-size: 1.15em; font-weight: 300; color: #e2e8f0; margin-bottom: 0.2em; border: none; }
section.cover h3 { font-size: 0.8em; font-weight: 300; color: #cbd5e1; opacity: 0.7; }

/* ─── DIVIDERS ─── */
section.divider {
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: white; padding: 70px;
}
section.divider h1 { font-size: 2.4em; font-weight: 900; color: #60a5fa; border: none; margin-bottom: 0.1em; }
section.divider h2 { font-size: 1em; font-weight: 300; color: #94a3b8; border-left: 4px solid #6366f1; padding-left: 14px; }

/* ─── DARK ─── */
section.dark { background: #0f172a; color: #e2e8f0; }
section.dark h1 { color: #60a5fa; }
section.dark h2 { color: #a78bfa; }
section.dark strong { color: #34d399; }
section.dark th { background: #334155; color: #e2e8f0; }
section.dark td { border-color: #334155; }

/* ─── ACCENT ─── */
section.accent {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  color: white;
}
section.accent h1 { color: white; font-size: 1.5em; border: none; }
section.accent h3 { color: #fde68a; }
section.accent strong { color: #fde68a; }
section.accent blockquote { border-left-color: #fde68a; color: #e2e8f0; background: rgba(255,255,255,0.1); }

/* ─── SUCCESS ─── */
section.success {
  background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
  color: white;
}
section.success h1 { color: #6ee7b7; border: none; }
section.success strong { color: #fde68a; }

/* ─── HEADINGS ─── */
h1 { color: #0f172a; font-size: 1.45em; font-weight: 800; border-bottom: 3px solid #6366f1; padding-bottom: 5px; margin: 0 0 12px 0; }
h2 { color: #475569; font-weight: 600; font-size: 0.85em; margin: 8px 0 4px 0; }
h3 { color: #6366f1; font-weight: 700; font-size: 0.78em; margin: 6px 0 3px 0; }

/* ─── TABLES ─── */
table { font-size: 0.72em; width: 100%; border-collapse: collapse; margin: 4px 0; }
th { background: #1e293b; color: white; padding: 4px 8px; font-weight: 600; }
td { padding: 3px 8px; border-bottom: 1px solid #e2e8f0; }
tr:nth-child(even) { background: #f1f5f9; }

/* ─── INLINE ─── */
strong { color: #4f46e5; }

<blockquote>
<p>Agent-generated scaffolds are <strong>~90% correct</strong>. The remaining 10% — auth tokens, API formats, cloud platform quirks — requires iterative debugging with real services.</p>

<table>

<tr>
<th>Issue</th>
<th>Root Cause</th>
<th style="text-align:center">Time</th>

<td style="text-align:center">~1h</td>
</tr>
<tr>
<td>Export 400</td>
<td>JPEG is not a valid Power BI ExportToFile format</td>
<td style="text-align:center">~30m</td>
</tr>
<tr>
<td>Export 403</td>
<td>Wrong endpoint: My Workspace vs <code>/groups/{id}/</code></td>
<td style="text-align:center">~1h</td>
</tr>
<tr>
<td>Auth header hijack</td>
<td>SWA overwrites <code>Authorization</code> → custom header</td>
<td style="text-align:center">~1h</td>
</tr>
<tr>
<td>JWT verification</td>
<td>Needed <code>jsonwebtoken</code> + <code>jwks-rsa</code> for JWKS</td>
<td style="text-align:center">~1h</td>
</tr>
<tr>
<td>OpenAI 404</td>
<td>Double path <code>/openai/v1/</code> in endpoint</td>
<td style="text-align:center">~15m</td>
</tr>
<tr>
<td>Entra consent</td>
<td>Missing <code>user_impersonation</code> scope</td>
<td style="text-align:center">~30m</td>
</tr>
<tr>
<td>UI redesign</td>
<td>Fluent UI v9 branded header, cards, icons</td>
<td style="text-align:center">~2h</td>
</tr>
<tr>
<td><strong>Total integration</strong></td>
<td></td>
<td style="text-align:center"><strong>~7.5h</strong></td>
</tr>
</tbody>
</table>

<h1 id="speckit-the-spec-first-paradigm">Speckit: The Spec-First Paradigm</h1>
<p>The real paradigm shift: from <strong>code-first</strong> to <strong>specification-first</strong></p>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%94%B4-traditional"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f534.svg" data-marp-twemoji=""/> Traditional</h3>
<ol>
<li>Scoping meeting</li>
<li>Write specs (days/weeks)</li>
<li>Development (weeks/months)</li>
<li>Testing</li>
<li>Deployment</li>
<li>Documentation</li>
</ol>
<p><em>Spec is throwaway. Code is the deliverable.</em></p>
</div>
<div class="col">
<h3 id="%F0%9F%9F%A2-speckit-approach"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e2.svg" data-marp-twemoji=""/> Speckit Approach</h3>
<ol>
<li><strong>Write the spec</strong> (structured markdown)</li>
<li><strong>Agent generates</strong> the full codebase</li>
<li>Debug &amp; integration</li>
<li>Deployed <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ol>
<p><em>Spec IS the deliverable. Code is a derived artifact.</em></p>
</div>
</div>
<blockquote>
<p>With Speckit, human value focuses on the <strong>what</strong>, not the <strong>how</strong><br />

</blockquote>
